services:
  db:
    image: postgres:18-alpine
    container_name: flicked-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flicked
      POSTGRES_USER: flicked
      POSTGRES_PASSWORD: flicked_dev # local development only
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ wants the mount here, not on /data: it keeps each major
      # version in its own subdirectory so pg_upgrade can work later
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flicked -d flicked"]
      interval: 5s
      retries: 10

volumes:
  db-data:
